<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fara Studio" />
  <title>Fara Content Studio — Pilihan 1 (1 Video Fokus)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf8f8;
      color: #1e293b;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 28px);
      -webkit-tap-highlight-color: transparent;
    }
    /* Mencegah layar iPhone otomatis zoom saat kolom diketik */
    input, textarea, select {
      font-size: 16px !important;
    }
    .font-tiktok-classic { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
    .font-tiktok-bold { font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
    .font-tiktok-serif { font-family: 'Playfair Display', serif; font-weight: 700; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header Atas -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-rose-100 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 text-white flex items-center justify-center font-bold shadow-sm">
          F
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">Fara Content Studio</h1>
          <p class="text-[11px] text-slate-500">@faraddilla_ • TB 155 / BB 50</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openScheduleModal()" class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
          <span>📅 Jadwal</span>
          <span id="scheduleBadge" class="bg-amber-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
        <button onclick="openApiModal()" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
          <span id="apiDot" class="w-2 h-2 rounded-full bg-red-500"></span>
          <span>API</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4 space-y-5">

    <!-- Pengingat Anti-Spam Otomatis -->
    <div id="antiSpamBanner" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-3.5 text-xs text-amber-900 flex items-start gap-2.5">
      <span class="text-base leading-none">⚠️</span>
      <div>
        <p class="font-bold">Pengingat Anti-Spam Algoritma:</p>
        <p id="antiSpamText" class="mt-0.5 text-amber-800"></p>
      </div>
    </div>

    <!-- FORM UTAMA (PILIHAN 1: 1 VIDEO FOKUS) -->
    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
        <div>
          <h2 class="text-sm font-bold text-slate-900">✨ Buat Panduan Video Baru</h2>
          <p class="text-[11px] text-slate-500">Mode 1 Video Fokus — Siap syuting & edit hari ini</p>
        </div>
        <span class="px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-[10px] font-bold border border-rose-200">Pilihan 1</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Kategori -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">1. Kategori Produk</label>
          <select id="categoryInput" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:border-rose-500 focus:bg-white">
            <option value="Hijab & Sport">Hijab & Hijab Sport</option>
            <option value="OOTD & Fashion">OOTD (Atasan / Celana / Setelan)</option>
            <option value="Makeup & Skincare">Makeup & Skincare</option>
          </select>
        </div>

        <!-- Ketersediaan Barang -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">2. Ketersediaan Barang</label>
          <select id="sampleModeInput" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:border-rose-500 focus:bg-white">
            <option value="physical">Ada Barang Fisik (Try-On / Review)</option>
            <option value="greenscreen">Tanpa Sampel (Mode Green Screen Katalog)</option>
          </select>
        </div>
      </div>

      <!-- Deskripsi Video -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">3. Deskripsikan Produk & Video yang Mau Dibuat</label>
        <textarea id="descInput
